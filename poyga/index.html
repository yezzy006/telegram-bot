<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tungi Trassa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@400;600&display=swap">
<style>
  /* Layout: one-screen arcade — tall road canvas centred, HUD on top, touch pedals below */
  :root {
    --night: #0d1118;      /* sky / page */
    --asphalt: #1b212b;    /* road */
    --paint: #e9edf2;      /* lane markings, text */
    --sodium: #ffb547;     /* street-lamp amber accent */
    --brake: #ff4d5e;      /* crash / danger */
    --dim: #7d8796;        /* secondary text */
    --display: "Russo One", "Arial Black", system-ui, sans-serif;
    --body: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night); color: var(--paint); font-family: var(--body);
    display: flex; flex-direction: column; align-items: center;
    padding-inline: 16px; box-sizing: border-box; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .hud {
    width: 100%; max-width: 420px; display: flex; justify-content: space-between;
    align-items: baseline; padding-block: 10px 8px; gap: 12px;
  }
  .brand { font-family: var(--display); font-size: 1.1rem; letter-spacing: .04em; color: var(--sodium); }
  .stats { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; }
  .stat small { font-size: .65rem; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
  .stat b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
  .stage { position: relative; flex: 1; min-height: 0; width: 100%; max-width: 420px; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 6px; background: var(--asphalt); }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; text-align: center; padding: 24px;
    background: color-mix(in srgb, var(--night) 78%, transparent); border-radius: 6px;
  }
  .overlay h1 { font-family: var(--display); font-weight: 400; font-size: 2.4rem; margin: 0; line-height: 1; text-wrap: balance; }
  .overlay h1 span { color: var(--sodium); }
  .overlay p { margin: 0; color: var(--dim); max-width: 28ch; line-height: 1.45; }
  .overlay .result { font-family: var(--display); font-size: 1.6rem; color: var(--paint); }
  .overlay .crash { color: var(--brake); font-family: var(--display); letter-spacing: .1em; text-transform: uppercase; font-size: .9rem; }
  button.go {
    font-family: var(--display); font-size: 1.1rem; letter-spacing: .06em; color: var(--night);
    background: var(--sodium); border: 0; border-radius: 4px; padding: 14px 34px; cursor: pointer;
  }
  button.go:focus-visible, .pedal:focus-visible { outline: 3px solid var(--paint); outline-offset: 3px; }
  .pedals {
    width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    padding-block: 10px 12px;
  }
  .pedal {
    font-family: var(--display); font-size: 1.6rem; color: var(--paint); background: var(--asphalt);
    border: 1px solid #2c3442; border-radius: 6px; padding-block: 14px; cursor: pointer;
  }
  .pedal.on { background: var(--sodium); color: var(--night); }
  .keys { font-size: .75rem; color: var(--dim); }
  @media (hover: hover) and (pointer: fine) { .pedals { display: none; } }
</style>

<div class="hud">
  <div class="brand">TUNGI TRASSA</div>
  <div class="stats">
    <div class="stat"><small>Masofa</small><b id="dist">0.00 km</b></div>
    <div class="stat"><small>Tezlik</small><b id="speed">0</b></div>
    <div class="stat"><small>Rekord</small><b id="best">0.00</b></div>
  </div>
</div>

<div class="stage" id="stage">
  <canvas id="road" aria-label="Poyga yo'li"></canvas>
  <div class="overlay" id="menu">
    <h1>Tungi <span>Trassa</span></h1>
    <p>Mashinalarni chetlab o'ting, oltin tangalarni yig'ing. Tezlik asta-sekin oshadi.</p>
    <button class="go" id="start">BOSHLASH</button>
    <div class="keys">← → yoki A / D · pastdagi tugmalar · ekranni surish</div>
  </div>
  <div class="overlay" id="over" hidden>
    <div class="crash">To'qnashuv!</div>
    <div class="result" id="final">0.00 km</div>
    <p id="verdict"></p>
    <button class="go" id="again">YANA BIR BOR</button>
  </div>
</div>

<div class="pedals">
  <button class="pedal" id="left" aria-label="Chapga">◀</button>
  <button class="pedal" id="right" aria-label="O'ngga">▶</button>
</div>

<script>
(() => {
  const W = 360, H = 640, LANES = 3, LANE_W = 96, ROAD_X = (W - LANE_W * LANES) / 2;
  const laneX = i => ROAD_X + LANE_W * i + LANE_W / 2;
  const cv = document.getElementById('road'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let scale = 1;
  function fit() {
    const r = $('stage').getBoundingClientRect();
    const s = Math.min(r.width / W, r.height / H);
    cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.style.margin = '0 auto';
    const dpr = window.devicePixelRatio || 1;
    cv.width = W * s * dpr; cv.height = H * s * dpr; scale = s * dpr;
    draw();
  }

  let best = 0;
  try { best = parseFloat(localStorage.getItem('tt-best')) || 0; } catch (e) {}
  $('best').textContent = best.toFixed(2);

  const palette = ['#4fa3ff', '#7ee0a1', '#d98cff', '#f2f2f2', '#ff8a4c'];
  let st;
  function reset() {
    st = { running: false, lane: 1, x: laneX(1), speed: 260, dist: 0, coins: 0,
           cars: [], gold: [], stripe: 0, spawn: 0, coinT: 1.2, shake: 0 };
  }

  function spawnCar() {
    const busy = new Set(st.cars.filter(c => c.y < 140).map(c => c.lane));
    const free = [0, 1, 2].filter(l => !busy.has(l));
    if (free.length <= 1) return;            // always leave a gap
    const lane = free[Math.random() * free.length | 0];
    st.cars.push({ lane, y: -90, v: 90 + Math.random() * 90, col: palette[Math.random() * palette.length | 0] });
  }

  function steer(d) {
    if (!st.running) return;
    st.lane = Math.max(0, Math.min(LANES - 1, st.lane + d));
  }

  function update(dt) {
    st.speed = Math.min(720, st.speed + 9 * dt);
    st.dist += st.speed * dt / 3600 * 1.6;         // px/s mapped to km
    st.stripe = (st.stripe + st.speed * dt) % 80;
    st.x += (laneX(st.lane) - st.x) * Math.min(1, dt * 14);

    st.spawn -= dt;
    if (st.spawn <= 0) { spawnCar(); st.spawn = Math.max(0.42, 1.25 - st.speed / 900) * (0.7 + Math.random() * 0.6); }
    st.coinT -= dt;
    if (st.coinT <= 0) { st.gold.push({ lane: Math.random() * 3 | 0, y: -30 }); st.coinT = 1.5 + Math.random() * 1.5; }

    for (const c of st.cars) c.y += (st.speed - c.v) * dt;
    for (const g of st.gold) g.y += st.speed * dt;
    st.cars = st.cars.filter(c => c.y < H + 100);

    const py = H - 120;
    for (const g of st.gold) {
      if (!g.hit && Math.abs(laneX(g.lane) - st.x) < 34 && Math.abs(g.y - py) < 50) { g.hit = true; st.coins++; st.dist += 0.05; }
    }
    st.gold = st.gold.filter(g => !g.hit && g.y < H + 40);

    for (const c of st.cars) {
      if (Math.abs(laneX(c.lane) - st.x) < 40 && Math.abs(c.y - py) < 78) return crash();
    }
    $('dist').textContent = st.dist.toFixed(2) + ' km';
    $('speed').textContent = Math.round(st.speed / 4);
  }

  function crash() {
    st.running = false; st.shake = reduce ? 0 : 14;
    const km = st.dist;
    const record = km > best;
    if (record) { best = km; try { localStorage.setItem('tt-best', best.toFixed(3)); } catch (e) {} }
    $('best').textContent = best.toFixed(2);
    $('final').textContent = km.toFixed(2) + ' km';
    $('verdict').textContent = (record ? 'Yangi rekord! ' : 'Rekord: ' + best.toFixed(2) + ' km. ') + 'Tangalar: ' + st.coins;
    setTimeout(() => { $('over').hidden = false; $('again').focus(); }, 450);
  }

  function car(x, y, body, player) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-22, -36, 48, 78);
    ctx.fillStyle = body; roundRect(-24, -40, 48, 80, 9); ctx.fill();
    ctx.fillStyle = '#10141b'; roundRect(-18, player ? -18 : -24, 36, 18, 4); ctx.fill();
    roundRect(-18, player ? 14 : 10, 36, 12, 3); ctx.fill();
    if (player) {                              // headlights cast forward
      ctx.fillStyle = '#fff6d6'; ctx.fillRect(-20, -42, 9, 4); ctx.fillRect(11, -42, 9, 4);
      ctx.fillStyle = '#ff4d5e'; ctx.fillRect(-20, 38, 9, 3); ctx.fillRect(11, 38, 9, 3);
    } else {                                   // tail lights face the player
      ctx.fillStyle = '#ff4d5e'; ctx.fillRect(-20, 37, 9, 4); ctx.fillRect(11, 37, 9, 4);
    }
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function draw() {
    if (!st) return;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (st.shake > 0) { ctx.translate((Math.random() - .5) * st.shake, (Math.random() - .5) * st.shake); st.shake *= 0.85; if (st.shake < .5) st.shake = 0; }
    ctx.fillStyle = '#0d1118'; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.fillStyle = '#1b212b'; ctx.fillRect(ROAD_X, -20, LANE_W * LANES, H + 40);

    // sodium lamps on the verges
    for (let y = -160 + (st.stripe * 2) % 160; y < H + 160; y += 160) {
      for (const side of [ROAD_X - 14, ROAD_X + LANE_W * LANES + 14]) {
        const g = ctx.createRadialGradient(side, y, 2, side, y, 70);
        g.addColorStop(0, 'rgba(255,181,71,.35)'); g.addColorStop(1, 'rgba(255,181,71,0)');
        ctx.fillStyle = g; ctx.fillRect(side - 70, y - 70, 140, 140);
        ctx.fillStyle = '#ffb547'; ctx.beginPath(); ctx.arc(side, y, 3, 0, 7); ctx.fill();
      }
    }
    ctx.fillStyle = '#e9edf2';
    ctx.fillRect(ROAD_X + 4, -20, 3, H + 40); ctx.fillRect(ROAD_X + LANE_W * LANES - 7, -20, 3, H + 40);
    for (let i = 1; i < LANES; i++)
      for (let y = -80 + st.stripe; y < H; y += 80) ctx.fillRect(ROAD_X + LANE_W * i - 2, y, 4, 40);

    for (const g of st.gold) {
      ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.arc(laneX(g.lane), g.y, 11, 0, 7); ctx.fill();
      ctx.fillStyle = '#c98a1e'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$', laneX(g.lane), g.y + 1);
    }
    for (const c of st.cars) car(laneX(c.lane), c.y, c.col, false);

    const py = H - 120;
    const beam = ctx.createLinearGradient(0, py - 40, 0, py - 220);
    beam.addColorStop(0, 'rgba(255,246,214,.28)'); beam.addColorStop(1, 'rgba(255,246,214,0)');
    ctx.fillStyle = beam; ctx.beginPath();
    ctx.moveTo(st.x - 20, py - 40); ctx.lineTo(st.x - 46, py - 220); ctx.lineTo(st.x + 46, py - 220); ctx.lineTo(st.x + 20, py - 40); ctx.fill();
    car(st.x, py, '#ffb547', true);
  }

  let last = 0;
  function loop(t) {
    const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
    if (st.running) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    reset(); st.running = true;
    $('menu').hidden = true; $('over').hidden = true; cv.focus?.();
  }

  addEventListener('keydown', e => {
    if (['ArrowLeft', 'a', 'A'].includes(e.key)) { steer(-1); e.preventDefault(); }
    if (['ArrowRight', 'd', 'D'].includes(e.key)) { steer(1); e.preventDefault(); }
    if ((e.key === 'Enter' || e.key === ' ') && !st.running && document.activeElement?.tagName !== 'BUTTON') start();
  });
  for (const [id, d] of [['left', -1], ['right', 1]]) {
    const b = $(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); steer(d); b.classList.add('on'); });
    for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => b.classList.remove('on'));
  }
  let sx = null;
  cv.addEventListener('pointerdown', e => { sx = e.clientX; });
  cv.addEventListener('pointerup', e => {
    if (sx === null) return;
    const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 25) steer(dx > 0 ? 1 : -1);
    else { const r = cv.getBoundingClientRect(); steer(e.clientX < r.left + r.width / 2 ? -1 : 1); }
  });
  $('start').addEventListener('click', start);
  $('again').addEventListener('click', start);

  reset();
  // idle traffic behind the menu so the first frame shows a road in motion
  st.cars.push({ lane: 0, y: 140, v: 120, col: palette[0] }, { lane: 2, y: 330, v: 150, col: palette[2] });
  st.gold.push({ lane: 1, y: 250 });
  addEventListener('resize', fit); fit();
  requestAnimationFrame(loop);
})();
</script>

</html>
