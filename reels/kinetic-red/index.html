 [24.12,"w",[L(700,W("O‘ZBEKCHA",24.12,150,"ink","rise")),L(870,W("MATN",24.68,150,"ink","rise")),

const sc=$("sc");let cur=-1;let EV=[],IT=[];
function setScene(i){
  const bg=SC[i][1];let bk="";if(bg=="k")for(let j=0;j<7;j++)bk+=`<div class="bokeh" data-i="${j}"></div>`;
  sc.innerHTML=`<div class="bg bg-${bg}">${bk}</div>`+SC[i][2].join("");cur=i;
  EV=[...new Set([...sc.querySelectorAll('[data-at]')].map(e=>+e.dataset.at).filter(x=>x>SC[i][0]+.05))].sort((a,b)=>a-b);
  IT=[...sc.querySelectorAll('.it')];
  sc.querySelectorAll('.ln').forEach(ln=>{const max=900;const w=ln.scrollWidth;if(w>max){const r=max/w;ln.querySelectorAll('.wd').forEach(wd=>wd.style.fontSize=(parseFloat(wd.style.fontSize)*r)+'px');}});
}
const ST={pop:.03,rise:.035,type:.045};
function wordAnim(w,v){
  const x=v-(+w.dataset.at),m=w.dataset.m,st=w.style;
  if(m==="slam"||m==="glitch"||m==="fill"){
    if(x<0){st.opacity=0;return;}st.opacity=1;
    if(m==="slam"){const k=eo(clamp(x/.18));st.transform=`scale(${2.2-1.2*k})`;st.filter=`blur(${(1-k)*16}px)`;st.opacity=clamp(x/.04);}
    else if(m==="fill"){const k=eo(clamp(x/.2));st.transform=`scale(${1.35-.35*k})`;st.color=x>.3?"#fff":"transparent";st.opacity=k;}
    else{ if(x<.42){const f=Math.floor(x*30);st.transform=`translate(${(hash(f)-.5)*70}px,${(hash(f+9)-.5)*20}px) skewX(${(hash(f+3)-.5)*20}deg)`;st.textShadow=`${(hash(f+5)-.5)*36}px 0 #00e5ff,${(hash(f+7)-.5)*36}px 0 #fff`;st.clipPath=f%4==0?"none":`inset(${hash(f+11)*45}% 0 ${hash(f+13)*30}% 0)`;}else{st.transform="none";st.textShadow="0 0 50px rgba(255,46,42,.8)";st.clipPath="none";}}
    return;
  }
  const chs=w.children,s=ST[m]||.03;
  for(let i=0;i<chs.length;i++){const c=chs[i],xc=x-i*s,cs=c.style;
    if(xc<0){cs.opacity=0;c.classList.remove("blk");continue;}
    cs.opacity=1;
    if(m==="pop"){const k=eo(clamp(xc/.16));cs.transform=`translateY(${(1-k)*-24}px) scale(${1.8-.8*k})`;cs.filter=`blur(${(1-k)*10}px)`;cs.opacity=clamp(xc/.05);}
    else if(m==="rise"){const k=eo(clamp(xc/.22));cs.transform=`perspective(500px) translateY(${(1-k)*50}%) rotateX(${(1-k)*85}deg)`;cs.opacity=k;}
    else if(m==="type"){c.classList.toggle("blk",xc<.06);cs.transform="none";}
  }
}
function itemAnim(el,v){
  const x=v-(+el.dataset.at),a=el.dataset.a,st=el.style;
  const base=el.classList.contains("it")?"translate(-50%,-50%) ":"";
  if(x<0){st.opacity=0;return;}st.opacity=1;
  if(a==="pop"){const k=eback(clamp(x/.3));st.transform=base+`scale(${Math.max(0,k)})`;st.filter=`blur(${(1-clamp(x/.15))*10}px)`;}
  else if(a==="up"){const k=eo(clamp(x/.22));st.transform=base+`translateY(${(1-k)*30}px)`;st.opacity=k;}
  else if(a==="stamp"){const k=eo(clamp(x/.16));st.transform=base+`scale(${2.4-1.4*k})`;st.opacity=clamp(x/.04);}
}
function render(t){
  const v=t*RATE;
  let i=0;while(i+1<SC.length&&v>=SC[i+1][0])i++;
  if(i!==cur)setScene(i);
  const t0=SC[i][0],t1=i+1<SC.length?SC[i+1][0]:VEND+1,lv=v-t0;
  const dir=i%2?1:-1;let wx=0,wr=0,ws=1,wb=0;
  const kin=1-clamp(lv/.16),kout=clamp((v-(t1-.13))/.13);
  if(kin>0&&i>0){const k=eo(kin);wx=-dir*620*k;wr=-dir*10*k;ws=1+.25*k;wb=26*k;}
  if(kout>0&&i+1<SC.length){const k=kout*kout;wx=dir*620*k;wr=dir*10*k;ws=1+.25*k;wb=26*k;}
  let pk=0,px=0,py=0;for(const e of EV){const x=v-e;if(x>=0&&x<.28){const k=Math.pow(1-x/.28,2);pk+=k;const f=Math.floor(x*60)+Math.floor(e*100);px+=(hash(f)-.5)*22*k;py+=(hash(f+1)-.5)*22*k;}}
  pk=Math.min(pk,1.2);
  const ez=1-Math.exp(-lv/1.2);const zoom=1+.08*ez+.06*pk;
  const pan=Math.sin(v*.9+i)*28, tilt=Math.sin(v*.7+i*2)*1.6;
  sc.style.transform=`translate(${wx+px+pan}px,${py-ez*30}px) rotate(${wr+tilt}deg) scale(${ws*zoom}) rotateY(${Math.sin(v*1.1+i)*8}deg) rotateX(${Math.cos(v*.8)*5}deg)`;
  sc.style.filter=wb>0.3?`blur(${wb}px)`:"none";
  sc.querySelectorAll(".wd").forEach(w=>wordAnim(w,v));
  sc.querySelectorAll("[data-a]").forEach(el=>itemAnim(el,v));
  IT.forEach((el,j)=>{const x=v-(+el.dataset.at);if(x>.35&&el.dataset.a!=='stamp'){el.style.transform=`translate(-50%,-50%) translateY(${Math.sin(v*2.4+j*1.7)*10}px) rotate(${Math.sin(v*1.7+j)*1.2}deg)`;}});
  sc.querySelectorAll('.ln').forEach((ln,j)=>{ln.style.transform=`translate(-50%,-50%) translateY(${Math.sin(v*2+j*2.1)*6}px) scale(${1+Math.sin(v*3+j)*.012})`;});
